<body class="d-flex justify-content-center min-vh-100 bg-body-secondary">
    <main class="form-signin w-100 p-4 p-sm-5 mt-5 bg-body rounded-4 shadow align-self-start position-relative"
        style="max-width: 380px;">
        <form (ngSubmit)="onRegister()">
            <h1 class="h3 mb-3 fw-normal">Registration</h1>
            <button type="button" class="btn-close position-absolute top-0 end-0 m-3" aria-label="Close"
                routerLink="/"></button>
            <div class="mb-3">
                <label for="exampleInputUsername" class="form-label">Username</label>
                <input type="text" class="form-control" id="username" [(ngModel)]="username" name="username"
                    placeholder="Enter your username" required minlength="3" maxlength="20" autocomplete="username">
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control" id="password" [(ngModel)]="password" name="password"
                    placeholder="••••••••" required minlength="6" autocomplete="new-password">
                <div class="col-auto">
                    <span id="passwordHelpInline" class="form-text">
                        Must be at least 6 characters long.
                    </span>
                </div>
                <label class="form-label mb-2 mt-2" for="confirmPassword">Confirm Password</label>
                <input type="password" class="form-control" id="confirmPassword" [(ngModel)]="confirmPassword"
                    name="confirmPassword" placeholder="••••••••" required autocomplete="new-password">
            </div>
            @if (errorMessage()) {
            <div class="alert alert-danger text-center" role="alert">
                {{ errorMessage() }}
            </div>
            }

            <button class="btn btn-primary mt-2 w-100 py-2" type="submit" [disabled]="isLoading() || isFormInvalid()">
                @if (isLoading()) {
                    <span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
                    Registering...
                } @else {
                    Register
                }
            </button>
        </form>
    </main>
</body>
