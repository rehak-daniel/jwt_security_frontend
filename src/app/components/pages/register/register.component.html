<body class="d-flex justify-content-center min-vh-100 bg-body-secondary">
    <main class="form-signin w-100 p-4 p-sm-5 mt-5 bg-body rounded-4 shadow align-self-start position-relative" style="max-width: 380px;">
        <form>
            <h1 class="h3 mb-3 fw-normal">Registration</h1>
            <button type="button" class="btn-close position-absolute top-0 end-0 m-3" aria-label="Close" routerLink="/"></button>
            <div class="mb-3">
                        <label for="exampleInputUsername" class="form-label">Username</label>
                        <input type="text" class="form-control" id="exampleInputUsername" placeholder="Enter your username"
                            aria-describedby="usernameHelp">
                    </div>
            <div class="mb-3">
                        <label for="exampleInputPassword1" class="form-label">Password</label>
                        <input type="password" class="form-control" id="exampleInputPassword1" placeholder="••••••••">
                        <div class="col-auto">
                            <span id="passwordHelpInline" class="form-text">
                                Must be 8-20 characters long.
                            </span>
                        </div>
                        <label class="form-label mb-2 mt-2" for="exampleInputPassword2">Confirm Password</label>
                        <input type="password" class="form-control" id="exampleInputPassword2" placeholder="••••••••">
                    </div>
            <button class="btn btn-primary mt-2 w-100 py-2" type="submit">Register</button>
        </form>
    </main>
</body>
