<nav class="navbar navbar-expand-lg bg-body-tertiary">
  <div class="container-fluid">
    <a class="navbar-brand" href="">Navbar</a>

    @if (isLoggedIn()) {
    <button routerLink="dashboard" class="btn btn-outline-secondary ms-2">Dashboard</button>
    }
    <div class="d-flex" role="search">
    
      @if (!isSignInPage() && !isLoggedIn()) {
      <button routerLink="login" class="btn btn-outline-success ms-2">Log in</button>
      }

      @if (!isRegisterPage() && !isSignInPage() && !isLoggedIn()) {
      <button routerLink="register" class="btn btn-outline-primary ms-2">Register</button>
      }

      @if (isLoggedIn()) {
      <button (click)="onLogout()" class="btn btn-outline-danger ms-2">Log out</button>
      }

    </div>
  </div>
</nav>
